version: "3.8"

services:
  #Contenedor para MySQL
  mysql:
    image: mysql:8
    container_name: devcards_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devcards
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

#Volumen para persistir datos de MySQL
volumes:
  mysql_data: